apiVersion: apps/v1
kind: Deployment

metadata:
  name: microservicio-devops
  namespace: devops

spec:
  replicas: 1

  selector:
    matchLabels:
      app: microservicio

  template:
    metadata:
      labels:
        app: microservicio

    spec:
      containers:
        - name: microservicio

          image: microservicio-devops:latest

          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 5000

          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"

            limits:
              cpu: "500m"
              memory: "512Mi"