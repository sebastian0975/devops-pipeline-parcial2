version: '3.9'

services:
  microservicio:
    build: .
    container_name: microservicio-devops
    ports:
      - "5000:5000"
    environment:
      - APP_ENV=development
    restart: unless-stopped
    networks:
      - backend
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  backend: